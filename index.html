<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8efe9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>성분일기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* ── 기본 뼈대 (깃허브 Pages에서 직접 열릴 때 필요) ── */
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}

/* 레이아웃: 매장에서 한 손으로 쓰는 세로 앱 — 상단 검색, 타일 그리드, 하단 고정 탭 + 가운데 카메라 */
:root{
  --bg:#e8efe9; --blob-a:#f6d9bd; --blob-b:#cfe3da;
  --surface:rgba(255,255,255,.72); --surface-solid:#ffffff; --line:rgba(31,45,40,.10);
  --ink:#16211d; --ink-2:#4a5a53; --muted:#78877f;
  --accent:#C4622F; --accent-ink:#ffffff; --accent-soft:#fbe8dc;
  --good:#1f7a4d; --good-soft:#dcefe3;
  --warn:#b3341f; --warn-soft:#fbe2dd;
  --shadow:0 6px 20px rgba(31,45,40,.07);
  --f-body:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --blob-a:#3a2a1e; --blob-b:#1b2a26;
  --surface:rgba(32,42,38,.72); --surface-solid:#1d2724; --line:rgba(255,255,255,.10);
  --ink:#eef3f0; --ink-2:#b4c2bb; --muted:#8a9a92;
  --accent:#e8824a; --accent-ink:#1a0f08; --accent-soft:#3a2418;
  --good:#5fcf96; --good-soft:#15322a; --warn:#ff8a70; --warn-soft:#3a1d18;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121816; --blob-a:#3a2a1e; --blob-b:#1b2a26;
  --surface:rgba(32,42,38,.72); --surface-solid:#1d2724; --line:rgba(255,255,255,.10);
  --ink:#eef3f0; --ink-2:#b4c2bb; --muted:#8a9a92;
  --accent:#e8824a; --accent-ink:#1a0f08; --accent-soft:#3a2418;
  --good:#5fcf96; --good-soft:#15322a; --warn:#ff8a70; --warn-soft:#3a1d18;
  --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 40% at 85% 8%,var(--blob-a) 0%,transparent 70%),
             radial-gradient(70% 45% at 5% 95%,var(--blob-b) 0%,transparent 70%);}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(108px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}

/* 검색 */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:999px;padding:12px 18px;box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-size:15px;font-weight:500}
.search input::placeholder{color:var(--muted);font-weight:400}
.search svg{flex:0 0 auto;color:var(--muted)}

.sec{margin-top:26px}
.sec-h{font-size:19px;font-weight:900;letter-spacing:-.02em;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;overflow:hidden;background:var(--surface);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:20px;padding:16px;min-height:148px;
  display:flex;flex-direction:column;align-items:flex-start;text-align:left;box-shadow:var(--shadow);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ic{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;margin-bottom:auto}
.tile .tt{font-size:16px;font-weight:700;margin-top:14px;letter-spacing:-.01em}
.tile .ts{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.35}
.tile.hot{background:var(--accent);border-color:transparent}
.tile.hot .ic{background:rgba(255,255,255,.22);color:#fff}
.tile.hot .tt,.tile.hot .ts{color:#fff}
.tile.hot .ts{opacity:.88}
.tile .num{position:absolute;top:14px;right:16px;font-size:22px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.tile.hot .num{color:#fff}

.rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .tile{min-width:132px;min-height:132px;flex:0 0 auto}

/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface-solid);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;max-width:620px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;color:var(--muted);font-size:10.5px;font-weight:500}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.fab{justify-self:center;width:62px;height:62px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px rgba(196,98,47,.45);
  border:4px solid var(--surface-solid);transition:transform .15s}
.fab:active{transform:scale(.93)}
#shot{position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:.01;border:0;padding:0}

/* 진행 */
.load{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-top:14px}
.load p{margin:0 0 9px;font-size:13px;font-weight:500;color:var(--ink-2)}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0%;background:var(--accent);border-radius:99px;transition:width .2s}
.bar.run i{width:42%;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-42%}100%{margin-left:100%}}

/* 결과/상세 */
.photo{width:100%;max-width:100%;border-radius:18px;border:1px solid var(--line);margin-bottom:14px;display:block;box-shadow:var(--shadow)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--accent);margin-bottom:12px}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:15px;padding:13px 15px;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:9px}
.item .b{font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.item .n{font-size:14.5px;font-weight:500;margin-top:2px;line-height:1.35}
.item .m{font-size:11.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 10px;line-height:1.6}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.verdict{border-radius:18px;padding:16px 18px;margin-bottom:14px}
.verdict.ok{background:var(--good-soft);border:1px solid var(--good)}
.verdict.no{background:var(--warn-soft);border:1px solid var(--warn)}
.verdict.neutral{background:var(--surface);border:1px solid var(--line)}
.verdict h3{font-size:15.5px;font-weight:900;letter-spacing:-.01em}
.verdict.ok h3{color:var(--good)} .verdict.no h3{color:var(--warn)}
.verdict p{margin:6px 0 0;font-size:13px;color:var(--ink-2);line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{background:var(--surface-solid);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:500;color:var(--ink)}
.chip.bad{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:700}
.chip.good{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.item .nb{font-size:15px;font-weight:700;line-height:1.4;color:var(--ink);letter-spacing:-.01em}
.item .sl{color:var(--muted);font-weight:500}
.item.best{border-color:var(--accent);border-width:2px}
.flags{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.flag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px}
.flag.best{background:var(--accent-soft);color:var(--accent)}
.flag.ok{background:var(--good-soft);color:var(--good)}
.flag.no{background:var(--warn-soft);color:var(--warn)}
.morebtn{width:100%;margin-top:2px;border-radius:14px;padding:13px;font-size:14px;font-weight:700;border:1.5px dashed var(--line);background:var(--surface);color:var(--ink-2)}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10.5px;font-weight:700;margin-left:6px}
.tag.oy{background:var(--good-soft);color:var(--good)}
.tag.ds{background:var(--accent-soft);color:var(--accent)}
.tag.na{background:var(--line);color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.act{border-radius:14px;padding:13px;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--surface-solid)}
.act.y{border-color:var(--good);color:var(--good)} .act.y.on{background:var(--good);color:#fff}
.act.n{border-color:var(--warn);color:var(--warn)} .act.n.on{background:var(--warn);color:#fff}
.src{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5;border-top:1px solid var(--line);padding-top:10px}
.ttl{font-size:17px;font-weight:900;letter-spacing:-.02em;line-height:1.35}
.sub{font-size:12.5px;color:var(--accent);font-weight:700;margin-bottom:3px}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.h-sm{font-size:13px;font-weight:700;color:var(--ink-2);margin:18px 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="search">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    <input id="q" type="search" placeholder="브랜드 · 제품명 · 다이소 품번" autocomplete="off" enterkeyhint="search">
  </div>

  <div id="load" class="load">
    <p id="loadtx">성분 데이터를 불러오는 중입니다. 멈춘 게 아닙니다.</p>
    <div class="bar"><i id="loadbar"></i></div>
  </div>

  <!-- 홈 -->
  <div id="v-home" hidden>
    <div class="sec">
      <h2 class="sec-h">기록 도구</h2>
      <div class="grid2">
        <button class="tile" data-go="scan">
          <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M7 12h10"/></svg></span>
          <span class="tt">성분 보기</span>
          <span class="ts">제품 찍어서<br>전성분 확인</span>
        </button>
        <button class="tile hot" data-go="mine">
          <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5S4 15.6 4 10a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 5.6-8 10.5-8 10.5Z"/></svg></span>
          <span class="num" id="n-mine">0</span>
          <span class="tt">내 기준</span>
          <span class="ts">괜찮았던 것<br>안 맞았던 것</span>
        </button>
        <button class="tile" data-go="safe">
          <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 19 6v6c0 4.2-2.9 7.4-7 8.5-4.1-1.1-7-4.3-7-8.5V6Z"/><path d="m9 12 2 2 4-4"/></svg></span>
          <span class="num" id="n-safe">0</span>
          <span class="tt">안전지대</span>
          <span class="ts">나에게 괜찮았던<br>성분 울타리</span>
        </button>
        <button class="tile" data-go="trig">
          <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5"/><circle cx="12" cy="16.6" r="1.1" fill="currentColor" stroke="none"/><path d="M10.3 3.9 2.8 17.1A2 2 0 0 0 4.5 20h15a2 2 0 0 0 1.7-2.9L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></span>
          <span class="num" id="n-trig">0</span>
          <span class="tt">주의 성분</span>
          <span class="ts">걸러낸 것에만<br>있던 성분</span>
        </button>
      </div>
    </div>
    <div class="sec">
      <h2 class="sec-h">찾기 도구</h2>
      <div class="rail">
        <button class="tile" data-go="soon">
          <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="9" r="5"/><circle cx="16" cy="15" r="5"/></svg></span>
          <span class="tt">쌍둥이 찾기</span><span class="ts">성분이 닮은 제품</span>
        </button>
        <button class="tile" data-go="soon">
          <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg></span>
          <span class="tt">매장 필터</span><span class="ts">이 매장에 맞는 것</span>
        </button>
        <button class="tile" data-go="soon">
          <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h5"/></svg></span>
          <span class="tt">성분 사전</span><span class="ts">이 성분이 뭔가</span>
        </button>
      </div>
    </div>
    <p id="ver" style="text-align:center;color:var(--muted);font-size:10.5px;margin:20px 0 0">성분일기 v10</p>
  </div>

  <!-- 검색 결과 -->
  <div id="v-list" hidden>
    <img id="photo" class="photo" alt="방금 찍은 제품 사진" hidden>
    <h2 class="sec-h" id="listh">검색 결과</h2>
    <div id="results" class="list"></div>
  </div>

  <!-- 제품 상세 -->
  <div id="v-detail" hidden>
    <button class="back" data-go="back">‹ 뒤로</button>
    <div id="detail"></div>
  </div>

  <!-- 목록형 화면 -->
  <div id="v-page" hidden>
    <button class="back" data-go="back">‹ 뒤로</button>
    <div id="page"></div>
  </div>
</div>

<nav class="tabs">
  <div class="tabs-in">
    <button class="tab" data-go="home" aria-current="page">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20H4Z"/></svg>홈</button>
    <button class="tab" data-go="mine">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5S4 15.6 4 10a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 5.6-8 10.5-8 10.5Z"/></svg>내 기준</button>
    <button class="fab" id="cam" aria-label="제품 찍기">
      <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.4-2h7.2L17 8h3v11H4Z"/><circle cx="12" cy="13" r="3.4"/></svg></button>
    <button class="tab" data-go="safe">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 19 6v6c0 4.2-2.9 7.4-7 8.5-4.1-1.1-7-4.3-7-8.5V6Z"/></svg>안전지대</button>
    <button class="tab" data-go="trig">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 8v5"/><circle cx="12" cy="16.6" r="1.1" fill="currentColor" stroke="none"/><path d="M10.3 3.9 2.8 17.1A2 2 0 0 0 4.5 20h15a2 2 0 0 0 1.7-2.9L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>주의</button>
  </div>
</nav>
<input type="file" id="shot" accept="image/*">
<div id="camview" hidden style="position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column">
  <video id="camvid" autoplay playsinline muted style="flex:1;min-height:0;width:100%;object-fit:cover"></video>
  <div style="display:flex;align-items:center;justify-content:space-around;padding:14px 10px calc(16px + env(safe-area-inset-bottom,0px));background:#000">
    <button id="camclose" style="color:#fff;font-size:14px;font-weight:700;padding:10px 14px">닫기</button>
    <button id="camsnap" aria-label="찍기" style="width:66px;height:66px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.35)"></button>
    <button id="camlib" style="color:#fff;font-size:14px;font-weight:700;padding:10px 14px">보관함</button>
  </div>
</div>
<div id="toast" hidden style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:500;padding:9px 16px;border-radius:999px;box-shadow:var(--shadow);max-width:88%;text-align:center">버튼이 눌렸습니다</div>

<script>
var V=[],P=[],IDX=[],ready=false,lastView='home',pendingShot=null,pendingP=null;
var $=function(id){return document.getElementById(id)};

/* ---- 내 기록: 폰에만 저장 ---- */
/* 기록은 '몇 번째'가 아니라 '품번'으로 저장한다 — 데이터를 정리해 순서가 바뀌어도 안 꼬이게 */
var MY={};
function saveMy(){
  try{var o={};for(var k in MY){if(P[k])o[P[k][6]]=MY[k]}
      localStorage.setItem('bdiary.my2',JSON.stringify(o))}catch(e){}
}
function restoreMy(){
  try{var o=JSON.parse(localStorage.getItem('bdiary.my2')||'{}'),map={};
      for(var i=0;i<P.length;i++)map[P[i][6]]=i;
      for(var id in o){if(map[id]!=null)MY[map[id]]=o[id]}
      localStorage.removeItem('bdiary.my');}catch(e){}
}

/* ---- 차집합 엔진: 걸러낸 것에만 있고 괜찮은 것엔 없는 성분 ---- */
function sets(){
  var ok={},bad={},okN=0,badN=0;
  for(var k in MY){
    var i=+k; if(!P[i])continue;
    var ing=P[i][4],t=MY[k];
    if(t==='ok'){okN++;for(var a=0;a<ing.length;a++)ok[ing[a]]=1}
    else if(t==='no'){badN++;for(var b=0;b<ing.length;b++)bad[ing[b]]=1}
  }
  var trig=[];for(var x in bad){if(!ok[x])trig.push(+x)}
  return{ok:ok,bad:bad,trig:trig,okN:okN,badN:badN};
}

/* 사진을 줄여서 보낸다. 못 줄이면 원본 그대로. */
function prep(f){
  return new Promise(function(res){
    var done=false;
    var fb=function(){
      if(done)return; done=true;
      var fr=new FileReader();
      fr.onload=function(){res({b64:String(fr.result).split(',')[1],mime:f.type||'image/jpeg'})};
      fr.onerror=function(){res(null)};
      fr.readAsDataURL(f);
    };
    var img=new Image();
    img.onload=function(){
      if(done)return; done=true;
      try{
        var max=900,w=img.width,h=img.height,r=Math.min(1,max/Math.max(w,h));
        var c=document.createElement('canvas');
        c.width=Math.round(w*r);c.height=Math.round(h*r);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res({b64:c.toDataURL('image/jpeg',0.8).split(',')[1],mime:'image/jpeg'});
      }catch(e){done=false;fb()}
    };
    img.onerror=fb;
    setTimeout(fb,4000);
    img.src=URL.createObjectURL(f);
  });
}

var EN2KO={cica:'시카',calming:'카밍',calm:'카밍',toner:'토너',tonerpad:'토너패드',cream:'크림',serum:'세럼',essence:'에센스',ampoule:'앰플',ampule:'앰플',lotion:'로션',emulsion:'에멀전',cleanser:'클렌저',cleansing:'클렌징',foam:'폼',oil:'오일',water:'워터',mist:'미스트',mask:'마스크',pad:'패드',pads:'패드',sun:'선',sunscreen:'선크림',suncream:'선크림',sunstick:'선스틱',gel:'젤',balm:'밤',barrier:'배리어',repair:'리페어',soothing:'수딩',moisture:'모이스처',moisturizing:'모이스처라이징',moisturizer:'모이스처라이저',hydra:'하이드라',hydro:'하이드로',hydrating:'하이드레이팅',aqua:'아쿠아',clear:'클리어',big:'빅',daily:'데일리',deep:'딥',pure:'퓨어',fresh:'프레시',green:'그린',tea:'티',tree:'트리',teatree:'티트리',centella:'센텔라',madeca:'마데카',hyaluronic:'히알루로닉',hyal:'히알',collagen:'콜라겐',vitamin:'비타민',retinol:'레티놀',niacinamide:'나이아신아마이드',peptide:'펩타이드',ceramide:'세라마이드',panthenol:'판테놀',aloe:'알로에',rice:'라이스',honey:'허니',propolis:'프로폴리스',snail:'스네일',heartleaf:'어성초',toning:'토닝',glow:'글로우',bright:'브라이트',brightening:'브라이트닝',whitening:'화이트닝',white:'화이트',black:'블랙',red:'레드',blue:'블루',pink:'핑크',intense:'인텐스',intensive:'인텐시브',gentle:'젠틀',mild:'마일드',sensitive:'센서티브',relief:'릴리프',care:'케어',skin:'스킨',booster:'부스터',peeling:'필링',cushion:'쿠션',lip:'립',tint:'틴트',body:'바디',hand:'핸드',shampoo:'샴푸',treatment:'트리트먼트',perfect:'퍼펙트',origin:'오리진',original:'오리지널',premium:'프리미엄',plus:'플러스',ultra:'울트라',super:'슈퍼',light:'라이트',rich:'리치',soft:'소프트',smooth:'스무스',cooling:'쿨링',vegan:'비건',pore:'포어',acne:'아크네',trouble:'트러블',spot:'스팟',firming:'퍼밍',lifting:'리프팅',wrinkle:'링클',essential:'에센셜',active:'액티브',therapy:'테라피',derma:'더마',atobarrier:'아토베리어',bubble:'버블',micellar:'미셀라',scrub:'스크럽',sheet:'시트',sleeping:'슬리핑',eye:'아이'};
var TYPES=['토너','스킨','로션','에멀전','에센스','세럼','앰플','크림','젤','밤','오일','미스트','클렌저','폼','워터','패드','마스크','팩','선크림','선스틱','쿠션','립','샴푸','바디'];
/* 읽어온 네 칸으로 DB에서 후보 찾기 — 한 토막 틀려도 점수로 흡수된다 */
function matchFields(f){
  if(!f)return[];
  var code=f['품번']?String(f['품번']).replace(/\D/g,''):'';
  matchFields.codeMiss='';
  if(code.length>=5){
    var ex=[];
    for(var i=0;i<P.length;i++)if(String(P[i][6])===code)ex.push({i:i,sc:999});
    if(ex.length)return ex;
    matchFields.codeMiss=code;   // 품번을 읽었는데 DB에 없음 → 잘못 읽었을 수 있다
  }
  var price=f['가격']?parseInt(String(f['가격']).replace(/\D/g,''),10)||0:0;
  var toks=[];
  ['제품명_한글','제품명_영문','제품명_한글추정'].forEach(function(k){
    if(f[k])String(f[k]).split(/[\s·\/&+,]+/).forEach(function(t){
      t=norm(t);if(!t)return;
      toks.push(t);
      if(EN2KO[t]&&toks.indexOf(EN2KO[t])<0)toks.push(EN2KO[t]);   // 영어 → 한글 표기로도 찾기
    });
  });
  var brands=[];
  ['브랜드_한글','브랜드_영문','브랜드_한글추정'].forEach(function(k){
    if(!f[k])return;
    var raw=String(f[k]);
    if(/[×✕]|\sx\s/i.test(raw))return;     // CICA×HYALON 같은 콜라보 문구는 브랜드가 아님
    var b=norm(raw);if(b)brands.push(b);
  });
  if(!toks.length&&!brands.length)return[];
  var qjoin=toks.join('|');
  var out=[];
  for(var j=0;j<P.length;j++){
    var hay=norm(P[j][1]+P[j][0]),hit=0,cov=0;
    for(var t=0;t<toks.length;t++)if(hay.indexOf(toks[t])>-1){hit++;cov+=toks[t].length}
    var bb=0;
    for(var b2=0;b2<brands.length;b2++){
      var bn=brands[b2];
      if(bn.length>=2&&hay.indexOf(bn.slice(0,Math.min(5,bn.length)))>-1){bb=15;break}
    }
    if(!hit&&!bb)continue;
    var sc=hit*10+bb+(toks.length?hit/toks.length*5:0);
    sc+=6*Math.min(1,cov/Math.max(hay.length,1));   // 제품명이 읽은 글자로 많이 채워질수록 (군더더기 적을수록) 가산
    if(price&&P[j][3]===price)sc+=8;                  // 가격표 금액이 같으면 가산 (다이소 구분에 강함)
    // 제형이 다르면 감점 — 같은 브랜드 같은 라인의 토너/크림/에센스를 갈라준다
    for(var ty=0;ty<TYPES.length;ty++){
      var w=TYPES[ty],inQ=qjoin.indexOf(w)>-1,inP=hay.indexOf(w)>-1;
      if(inQ&&!inP)sc-=12; else if(!inQ&&inP)sc-=4;
    }
    out.push({i:j,sc:sc});
  }
  out.sort(function(a,b){return b.sc-a.sc});
  return out.slice(0,20);
}

function search(raw){

  }
  var hit=[];
  for(var i=0;i<IDX.length&&hit.length<60;i++){if(IDX[i].indexOf(k)>-1)hit.push(i)}
  $('listh').textContent='검색 결과 '+hit.length+(hit.length>=60?'+':'')+'건';
  if(!hit.length){
    $('results').innerHTML='<p class="empty">찾는 제품이 없습니다.<br>지금은 올리브영·다이소 '+P.length.toLocaleString()+'개가 들어 있습니다.<br>브랜드명이나 다이소 품번으로 다시 찾아보세요.</p>';
    go('list');return;
  }
  var h='';
  for(var j=0;j<hit.length;j++)h+=itemHTML(hit[j]);
  $('results').innerHTML=h;
  go('list');
}
$('results').addEventListener('click',function(e){
  var mb=e.target.closest('#morebtn');
  if(mb){$('more').hidden=false;mb.remove();return}
  if(e.target.closest('#retake')){openCam();return}
  if(e.target.closest('#retakelib')){shoot();return}
  var b=e.target.closest('[data-i]');if(b)go('detail',+b.dataset.i);
});

/* ---- 제품 상세 + 판정 ---- */
function detail(i){
  var p=P[i],s=sets(),trig={};
  for(var t=0;t<s.trig.length;t++)trig[s.trig[t]]=1;
  var hits=[],ing=p[4];
  for(var a=0;a<ing.length;a++)if(trig[ing[a]])hits.push(V[ing[a]]);
  var inSafe=0;
  for(var b=0;b<ing.length;b++)if(s.ok[ing[b]])inSafe++;

  var vb;
  if(p[5]===2){
    vb='<div class="verdict neutral"><h3>이 제품은 성분이 아직 없습니다</h3><p>제품은 찾아지지만 비교는 못 합니다. 아직 성분을 모으지 못한 다이소 제품입니다. 뒷면 전성분을 확인해 채워 넣으면 그때부터 비교됩니다.</p></div>';
  }else if(s.okN===0&&s.badN===0){
    vb='<div class="verdict neutral"><h3>아직 비교할 기준이 없습니다</h3><p>괜찮았던 제품과 안 맞았던 제품을 각각 하나씩 기록하면, 그때부터 이 자리에서 비교해 드립니다.</p></div>';
  }else if(hits.length){
    vb='<div class="verdict no"><h3>안 맞았던 제품에만 있던 성분 '+hits.length+'개 포함</h3>'
      +'<p>아래 성분은 지금까지 걸러내신 제품에는 있고, 괜찮았던 제품에는 없던 것입니다. 맞다 아니다를 판정한 것이 아니라, 기록이 어긋나는 지점만 짚은 것입니다.</p>'
      +'<div class="chips">'+hits.map(function(x){return '<span class="chip bad">'+esc(x)+'</span>'}).join('')+'</div></div>';
  }else{
    vb='<div class="verdict ok"><h3>걸러내신 성분은 없습니다</h3><p>지금까지 안 맞았던 제품에만 있던 성분은 이 제품에 들어 있지 않습니다. 괜찮았던 제품과 겹치는 성분은 '+inSafe+'개입니다.</p></div>';
  }

  var mk=MY[i]||'';
  var chips=ing.map(function(x){
    var c=trig[x]?'chip bad':(s.ok[x]?'chip good':'chip');
    return '<span class="'+c+'">'+esc(V[x])+'</span>';
  }).join('');

  $('detail').innerHTML=vb
    +'<div class="card"><div class="sub">'+esc(p[1])+'</div><div class="ttl">'+esc(p[0])+'</div>'
    +'<div class="meta">'+esc(p[2]||'')+(p[3]?' · '+p[3].toLocaleString()+'원':'')+'</div>'
    +'<div class="acts"><button class="act y'+(mk==='ok'?' on':'')+'" data-mark="ok" data-i="'+i+'">괜찮았어요</button>'
    +'<button class="act n'+(mk==='no'?' on':'')+'" data-mark="no" data-i="'+i+'">안 맞았어요</button></div>'
    +(ing.length?'<div class="h-sm">전성분 '+ing.length+'개</div><div class="chips">'+chips+'</div>':'')
    +'<p class="src">'+srcNote(p[5])+' 제조사가 전성분을 바꾸면 실제 제품과 다를 수 있으니, 용기 뒷면 표기를 함께 확인해 주세요. 이 화면은 기록·비교용이며 의학적 판단이 아닙니다.</p></div>';
}
$('detail').addEventListener('click',function(e){
  var b=e.target.closest('[data-mark]');if(!b)return;
  var i=+b.dataset.i,m=b.dataset.mark;
  if(MY[i]===m)delete MY[i];else MY[i]=m;
  saveMy();detail(i);
});

/* ---- 목록 화면들 ---- */
function pageMine(){
  var ks=Object.keys(MY);
  if(!ks.length){
    $('page').innerHTML='<h2 class="sec-h">내 기준</h2><p class="empty">아직 기록이 없습니다.<br><br>가운데 카메라로 쓰던 제품을 찍거나 검색해서<br>“괜찮았어요 / 안 맞았어요”를 눌러 두세요.<br>두 쪽이 모이면 비교가 시작됩니다.</p>';return;
  }
  var ok='',no='';
  ks.forEach(function(k){
    var p=P[k];if(!p)return;
    var row=itemHTML(+k);
    if(MY[k]==='ok')ok+=row;else no+=row;
  });
  $('page').innerHTML='<h2 class="sec-h">내 기준</h2>'
    +'<div class="h-sm">괜찮았던 제품</div><div class="list">'+(ok||'<p class="empty">없음</p>')+'</div>'
    +'<div class="h-sm">안 맞았던 제품</div><div class="list">'+(no||'<p class="empty">없음</p>')+'</div>';
}
function pageSafe(){
  var s=sets(),k=Object.keys(s.ok);
  $('page').innerHTML='<h2 class="sec-h">안전지대</h2>'
    +(k.length?'<div class="card"><p style="margin:0 0 4px;font-size:13px;color:var(--ink-2)">괜찮았다고 기록하신 제품 '+s.okN+'개에 들어 있던 성분 '+k.length+'개입니다.</p><div class="chips">'
      +k.map(function(x){return '<span class="chip good">'+esc(V[x])+'</span>'}).join('')+'</div></div>'
     :'<p class="empty">괜찮았던 제품을 한 개 이상 기록하면<br>여기에 성분 울타리가 그려집니다.</p>');
}
function pageTrig(){
  var s=sets();
  $('page').innerHTML='<h2 class="sec-h">주의 성분</h2>'
    +(s.trig.length?'<div class="card"><p style="margin:0 0 4px;font-size:13px;color:var(--ink-2)">안 맞았던 제품 '+s.badN+'개에는 있고, 괜찮았던 제품 '+s.okN+'개에는 없던 성분 '+s.trig.length+'개입니다. 원인으로 밝혀진 것이 아니라 겹치지 않는 지점입니다.</p><div class="chips">'
      +s.trig.map(function(x){return '<span class="chip bad">'+esc(V[x])+'</span>'}).join('')+'</div></div>'
     :'<p class="empty">괜찮았던 제품과 안 맞았던 제품을<br>각각 하나 이상 기록하면<br>여기에 차이 나는 성분이 모입니다.</p>');
}
function pageSoon(){
  $('page').innerHTML='<h2 class="sec-h">준비 중</h2><p class="empty">쌍둥이 찾기 · 매장 필터 · 성분 사전은<br>다음 단계에서 붙입니다.<br><br>지금은 찍기 → 검색 → 성분 → 비교까지가<br>실제로 도는지 확인하는 단계입니다.</p>';
}
/* 목록 한 줄 = "제품명 / 브랜드" 같은 글꼴로.
   제품명 앞의 [행사문구]와, 이름 앞에 또 붙은 브랜드는 떼서 알아보기 쉽게 한다 */
function cleanName(name,brand){
  var n=String(name||'').replace(/^(\s*[\[\(（【][^\]\)）】]*[\]\)）】]\s*)+/,'').trim();
  var bn=String(brand||'').replace(/\s+/g,'').toLowerCase();
  if(bn&&n.replace(/\s+/g,'').toLowerCase().indexOf(bn)===0){
    var cnt=0,k=0;
    while(k<n.length&&cnt<bn.length){if(!/\s/.test(n[k]))cnt++;k++}
    var rest=n.slice(k).trim();
    if(rest)n=rest;
  }
  return n||String(name||'');
}
function itemHTML(i,o){
  o=o||{};
  var p=P[i],mk=MY[i],fl=[];
  var brand=p[1],name=p[0];
  if(!brand){   // 브랜드 칸이 빈 제품: 이름 첫 단어를 브랜드로 보여준다 (표시만)
    var nm=cleanName(name,'').match(/^(\S{2,12})\s+(.+)$/);
    if(nm){brand=nm[1];name=nm[2]}
  }
  if(o.best)fl.push('<span class="flag best">가장 비슷함</span>');
  if(mk==='ok')fl.push('<span class="flag ok">괜찮았음</span>');
  if(mk==='no')fl.push('<span class="flag no">안 맞았음</span>');
  return '<button class="item'+(o.best?' best':'')+'" data-i="'+i+'">'
    +(fl.length?'<div class="flags">'+fl.join('')+'</div>':'')
    +'<div class="nb">'+esc(cleanName(name,brand))+(brand?'<span class="sl"> / </span>'+esc(brand):'')+'</div>'
    +'<div class="m">'+esc(p[2]||'')+(p[3]?' · '+p[3].toLocaleString()+'원':'')+(p[4].length?' · 성분 '+p[4].length:'')+srcTag(p[5])+'</div>'
    +'</button>';
}
function srcTag(s){return s===0?'<span class="tag oy">공식</span>':s===3?'<span class="tag oy">실물확인</span>':s===1?'<span class="tag ds">검증전</span>':'<span class="tag na">성분없음</span>'}
function srcNote(s){return s===0?'올리브영 상품정보고시에 공개된 전성분입니다.':s===3?'용기 뒷면 전성분을 한글·영문 표기로 맞춰 보고 확인한 성분입니다.':s===1?'다이소몰 상세이미지에서 읽어 모은 성분이라 아직 검증 전입니다. 글자를 잘못 읽은 것으로 보이는 성분은 걸러냈지만, 빠지거나 틀린 것이 남아 있을 수 있습니다.':'이 제품은 성분을 아직 모으지 못했습니다.'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
</script>
