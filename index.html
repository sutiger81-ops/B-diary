<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>성분일기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ── 기본 뼈대 ── */
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}

/* 디자인 언어: 밝은 바탕 · 흰 카드 · 큰 숫자 · 작은 파스텔 아이콘 · 떠 있는 하단바 */
:root{
  --bg:#f7f7f8;
  --surface:#ffffff; --surface-solid:#ffffff; --line:rgba(22,24,29,.09);
  --ink:#17181b; --ink-2:#5a5d64; --muted:#9a9da4;
  --accent:#C4622F; --accent-ink:#ffffff; --accent-soft:#f9e9de;
  --good:#1f9d61; --good-soft:#e4f5eb;
  --warn:#d9472b; --warn-soft:#fcebe6;
  --shadow:0 1px 2px rgba(20,22,26,.03),0 10px 26px rgba(20,22,26,.05);
  --f-body:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1012;
  --surface:#1a1c1f; --surface-solid:#1a1c1f; --line:rgba(255,255,255,.09);
  --ink:#f2f3f5; --ink-2:#b7bac1; --muted:#7f838b;
  --accent:#ef8749; --accent-ink:#1a0f08; --accent-soft:#36220f;
  --good:#4ecb8d; --good-soft:#14301f;
  --warn:#ff7a5c; --warn-soft:#3a1c14;
  --shadow:0 2px 8px rgba(0,0,0,.3),0 14px 30px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1012;
  --surface:#1a1c1f; --surface-solid:#1a1c1f; --line:rgba(255,255,255,.09);
  --ink:#f2f3f5; --ink-2:#b7bac1; --muted:#7f838b;
  --accent:#ef8749; --accent-ink:#1a0f08; --accent-soft:#36220f;
  --good:#4ecb8d; --good-soft:#14301f;
  --warn:#ff7a5c; --warn-soft:#3a1c14;
  --shadow:0 2px 8px rgba(0,0,0,.3),0 14px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(118px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}

/* 검색 */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:13px 18px;box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-size:15px;font-weight:500}
.search input::placeholder{color:var(--muted);font-weight:400}
.search svg{flex:0 0 auto;color:var(--muted)}

.sec{margin-top:28px}
.sec-h{font-size:13px;font-weight:700;letter-spacing:.01em;color:var(--muted);margin-bottom:12px;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;overflow:hidden;background:var(--surface);
  border:1px solid var(--line);border-radius:24px;padding:18px;min-height:150px;
  display:flex;flex-direction:column;align-items:flex-start;text-align:left;box-shadow:var(--shadow);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ic{width:34px;height:34px;border-radius:50%;background:transparent;border:2px solid var(--tfg,var(--accent));color:var(--tfg,var(--accent));
  display:grid;place-items:center}
.tile .ic svg{stroke-width:1.7}
.ic.pic{border:0!important;width:auto!important;background:transparent!important}
.ic.pic img{height:34px;width:auto;display:block;filter:drop-shadow(0 2px 3px rgba(30,120,200,.25))}
.tile .num{position:static;margin-top:auto;padding-top:12px;font-size:38px;font-weight:275;letter-spacing:-.01em;
  color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.tile .tt{font-size:13.5px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.tile .ts{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.t-scan .tt,.rail .tile .tt{margin-top:auto;padding-top:12px;font-size:15.5px;font-weight:800}
.t-scan .ts{color:var(--muted)}
.t-mine{background:linear-gradient(145deg,#e35a4e,#cf4752);border-color:transparent}
.t-mine>*{position:relative;z-index:1}
.t-mine>.glow{position:absolute;inset:0;z-index:0;display:grid;place-items:center;pointer-events:none}
.t-mine .glow img{height:125%;filter:blur(17px) saturate(1.15) brightness(.92);opacity:.95}
.t-mine .num,.t-mine .tt{color:#fff}
.t-mine .ts{color:rgba(255,255,255,.85)}
.t-mine .ic{border:0;width:auto;background:transparent;color:#fff}
.t-safe .ic{background:#FE691A;border:0;color:#fff;box-shadow:0 3px 8px rgba(254,105,26,.3)}
.t-trig .ic{background:#E8A513;border:0;color:#fff;box-shadow:0 3px 8px rgba(232,165,19,.3)}
.t-twin{--tic:#ece9fb;--tfg:#7a63d8}
.t-store{--tic:#e3f1fb;--tfg:#2f88c9}
.t-dict{--tic:#fdf3dc;--tfg:#c9930f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-mine{--tic:#3a1b26}:root:not([data-theme="light"]) .t-safe{--tic:#14301f}:root:not([data-theme="light"]) .t-trig{--tic:#3a1c14}:root:not([data-theme="light"]) .t-twin{--tic:#272045}:root:not([data-theme="light"]) .t-store{--tic:#16293a}:root:not([data-theme="light"]) .t-dict{--tic:#352a0e}}

.rail{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rail .tile{min-width:0;min-height:126px;padding:12px;border-radius:20px}
.rail .tile .ic{width:34px;height:34px;border-radius:50%}
.rail .tile .tt{font-size:12.5px;font-weight:700;margin-top:9px;padding-top:0;line-height:1.3;word-break:keep-all;min-height:2.6em}
.rail .tile .ts{font-size:10.5px;word-break:keep-all;margin-top:auto;padding-top:4px}
.rail .ic.pic{border:0!important;width:auto!important;height:34px;background:transparent!important;border-radius:0}
.rail .ic.pic img,.rail .ic.pic svg{height:34px;width:auto;display:block}
.t-store .ic.pic img{height:31px}
.t-dict .ic.pic img{height:29px}
/* 기록 도구: 숫자·제목·설명 줄 맞춤 */
.grid2 .tile .ts{min-height:2.9em}
.t-scan .tt{padding-top:56px}

/* 하단바: 떠 있는 알약 */
.tabs{position:fixed;z-index:20;background:var(--surface-solid);
  left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  bottom:calc(10px + env(safe-area-inset-bottom,0px));
  border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow)}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;max-width:620px;margin:0 auto;padding:0 6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;color:var(--muted);font-size:10px;font-weight:500}
.tab svg{box-sizing:content-box;padding:4px 14px;border-radius:999px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg{background:var(--ink);color:var(--surface-solid)}
.fab{justify-self:center;width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;margin-top:-24px;margin-bottom:8px;box-shadow:0 8px 20px rgba(196,98,47,.4);
  border:4px solid var(--surface-solid);transition:transform .15s}
.fab:active{transform:scale(.93)}
#shot{position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:.01;border:0;padding:0}

/* 진행 */
.load{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-top:14px}
.load p{margin:0 0 9px;font-size:13px;font-weight:500;color:var(--ink-2)}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0%;background:var(--accent);border-radius:99px;transition:width .2s}
.bar.run i{width:42%;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-42%}100%{margin-left:100%}}

/* 결과/상세 */
.photo{width:100%;max-width:100%;border-radius:20px;border:1px solid var(--line);margin-bottom:14px;display:block;box-shadow:var(--shadow)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--accent);margin-bottom:12px}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:9px}
.item .b{font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.item .n{font-size:14.5px;font-weight:500;margin-top:2px;line-height:1.35}
.item .m{font-size:11.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 10px;line-height:1.6}

.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.verdict{border-radius:20px;padding:16px 18px;margin-bottom:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.verdict.ok{background:var(--good-soft);border-color:transparent}
.verdict.no{background:var(--warn-soft);border-color:transparent}
.verdict.neutral{background:var(--surface)}
.verdict h3{font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.verdict.ok h3{color:var(--good)} .verdict.no h3{color:var(--warn)}
.verdict p{margin:6px 0 0;font-size:13px;color:var(--ink-2);line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500;color:var(--ink)}
.chip.bad{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:700}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good);font-weight:700}
.item .nb{font-size:15px;font-weight:700;line-height:1.4;color:var(--ink);letter-spacing:-.01em}
.item .sl{color:var(--muted);font-weight:500}
.item.best{border-color:var(--accent);border-width:2px}
.flags{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.flag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.flag.best{background:var(--accent-soft);color:var(--accent)}
.flag.ok{background:var(--good-soft);color:var(--good)}
.flag.no{background:var(--warn-soft);color:var(--warn)}
.morebtn{width:100%;margin-top:2px;border-radius:16px;padding:13px;font-size:14px;font-weight:700;border:1.5px dashed var(--line);background:var(--surface);color:var(--ink-2)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;margin-left:6px}
.tag.oy{background:var(--good-soft);color:var(--good)}
.tag.ds{background:var(--accent-soft);color:var(--accent)}
.tag.na{background:var(--line);color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.act{border:0;border-radius:18px;padding:15px;font-size:14px;font-weight:500;letter-spacing:-.01em;transition:box-shadow .15s,color .15s}
.act.y{background:#eef4ef;color:#3f8763;box-shadow:6px 6px 14px rgba(150,165,152,.35),-6px -6px 14px rgba(255,255,255,.95)}
.act.n{background:#f7f0ec;color:#bb5338;box-shadow:6px 6px 14px rgba(175,155,145,.33),-6px -6px 14px rgba(255,255,255,.95)}
.act.y.on{color:var(--good);background:#e7f1e9;font-weight:600;box-shadow:inset 5px 5px 11px rgba(140,158,142,.42),inset -5px -5px 11px rgba(255,255,255,.95)}
.act.n.on{color:var(--warn);background:#f6ece6;font-weight:600;box-shadow:inset 5px 5px 11px rgba(175,148,136,.42),inset -5px -5px 11px rgba(255,255,255,.95)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .act.y{background:#1d2a22;color:#58b388;box-shadow:6px 6px 14px rgba(0,0,0,.45),-6px -6px 14px rgba(255,255,255,.03)}
:root:not([data-theme="light"]) .act.n{background:#2d211b;color:#e0785c;box-shadow:6px 6px 14px rgba(0,0,0,.45),-6px -6px 14px rgba(255,255,255,.03)}
:root:not([data-theme="light"]) .act.y.on{color:#4ecb8d;background:#17251d;box-shadow:inset 5px 5px 11px rgba(0,0,0,.55),inset -5px -5px 11px rgba(255,255,255,.04)}
:root:not([data-theme="light"]) .act.n.on{color:#ff8a70;background:#271b15;box-shadow:inset 5px 5px 11px rgba(0,0,0,.55),inset -5px -5px 11px rgba(255,255,255,.04)}}
:root[data-theme="dark"] .act.y{background:#1d2a22;color:#58b388;box-shadow:6px 6px 14px rgba(0,0,0,.45),-6px -6px 14px rgba(255,255,255,.03)}
:root[data-theme="dark"] .act.n{background:#2d211b;color:#e0785c;box-shadow:6px 6px 14px rgba(0,0,0,.45),-6px -6px 14px rgba(255,255,255,.03)}
:root[data-theme="dark"] .act.y.on{color:#4ecb8d;background:#17251d;box-shadow:inset 5px 5px 11px rgba(0,0,0,.55),inset -5px -5px 11px rgba(255,255,255,.04)}
:root[data-theme="dark"] .act.n.on{color:#ff8a70;background:#271b15;box-shadow:inset 5px 5px 11px rgba(0,0,0,.55),inset -5px -5px 11px rgba(255,255,255,.04)}
.src{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5;border-top:1px solid var(--line);padding-top:10px}
.ttl{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.sub{font-size:12.5px;color:var(--accent);font-weight:700;margin-bottom:3px}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.h-sm{font-size:13px;font-weight:700;color:var(--ink-2);margin:18px 0 8px}

/* ── 무엇이 좋았나요 · 공통분모 · 닮은꼴 (v19) ── */
.dim{position:fixed;inset:0;z-index:49;background:rgba(15,16,18,.38)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface-solid);border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.15);max-width:620px;margin:0 auto}
.sheet h3{font-size:17px;font-weight:800;letter-spacing:-.02em}
.sheet p{margin:6px 0 16px;font-size:12.5px;color:var(--muted);line-height:1.5}
.why{display:block;width:100%;text-align:left;border-radius:16px;padding:15px 16px;margin-bottom:10px;font-size:14.5px;font-weight:600;background:#eef4ef;color:#2f6e4d;box-shadow:5px 5px 12px rgba(150,165,152,.3),-5px -5px 12px rgba(255,255,255,.95)}
.why small{display:block;font-size:11.5px;font-weight:500;color:#6f8a7a;margin-top:2px}
.why.on{background:#e3efe6;box-shadow:inset 4px 4px 9px rgba(140,158,142,.4),inset -4px -4px 9px rgba(255,255,255,.95)}
.done{font-size:13px;color:var(--good);font-weight:700;margin:6px 2px 12px;line-height:1.5}
.done.wait{color:var(--muted);font-weight:500}
.go{display:block;width:100%;border-radius:16px;padding:16px;font-size:15px;font-weight:700;background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(196,98,47,.35)}
.later{display:block;width:100%;margin-top:8px;padding:10px;font-size:13px;color:var(--muted)}
.drawer{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--surface-solid);border:1px solid var(--line);border-radius:22px;box-shadow:0 -6px 24px rgba(20,22,26,.08);max-width:600px;margin:0 auto}
.drawer .grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 0}
.drawer .hd{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 18px 14px;font-size:13.5px;font-weight:700;text-align:left}
.drawer .hd span{color:var(--accent)}
.drawer .bd{padding:0 18px 16px;max-height:52vh;overflow:auto}
.den .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.den .nm{font-size:13px;font-weight:600;line-height:1.35;word-break:keep-all;flex:1;padding-right:10px}
.den .pc{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rtag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:4px}
.rtag.sil{background:#ece9fb;color:#6b55c9}.rtag.col{background:#fdf0de;color:#b97a12}.rtag.moi{background:#e3f1fb;color:#2f78b5}.rtag.frg,.rtag.pre,.rtag.etc{background:var(--line);color:var(--muted)}
.note{margin-top:12px;background:#f6f4ff;border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.6;color:#4b4370}
.note b{color:#5a47c2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .why{background:#1d2a22;color:#7fd0a6;box-shadow:5px 5px 12px rgba(0,0,0,.45),-5px -5px 12px rgba(255,255,255,.03)}
:root:not([data-theme="light"]) .why small{color:#8fb3a0}
:root:not([data-theme="light"]) .why.on{background:#17251d;box-shadow:inset 4px 4px 9px rgba(0,0,0,.55),inset -4px -4px 9px rgba(255,255,255,.04)}
:root:not([data-theme="light"]) .note{background:#24203a;color:#cfc8f2}
:root:not([data-theme="light"]) .note b{color:#b3a6ff}
:root:not([data-theme="light"]) .rtag.sil{background:#2a2545;color:#b3a6ff}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="search">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    <input id="q" type="search" placeholder="브랜드 · 제품명 · 다이소 품번" autocomplete="off" enterkeyhint="search">
  </div>

  <div id="load" class="load">
    <p id="loadtx">성분 데이터를 불러오는 중입니다. 멈춘 게 아닙니다.</p>
    <div class="bar"><i id="loadbar"></i></div>
  </div>

  <!-- 홈 -->
  <div id="v-home" hidden>
    <div class="sec">
      <h2 class="sec-h">기록 도구</h2>

<script>
var V=[],P=[],IDX=[],ready=false,lastView='home',pendingShot=null,pendingP=null;
var $=function(id){return document.getElementById(id)};

/* ---- 내 기록: 폰에만 저장 ---- */
/* 기록은 '몇 번째'가 아니라 '품번'으로 저장한다 — 데이터를 정리해 순서가 바뀌어도 안 꼬이게 */
var MY={},WHY={};
function saveMy(){
  try{var o={},w={};for(var k in MY){if(P[k]){o[P[k][6]]=MY[k];if(MY[k]==='ok'&&WHY[k])w[P[k][6]]=WHY[k]}}
      localStorage.setItem('bdiary.my2',JSON.stringify(o));
      localStorage.setItem('bdiary.why',JSON.stringify(w))}catch(e){}
}
function restoreMy(){
  try{var o=JSON.parse(localStorage.getItem('bdiary.my2')||'{}'),map={};
      for(var i=0;i<P.length;i++)map[P[i][6]]=i;
      for(var id in o){if(map[id]!=null)MY[map[id]]=o[id]}
      var w=JSON.parse(localStorage.getItem('bdiary.why')||'{}');
      for(var id2 in w){if(map[id2]!=null)WHY[map[id2]]=w[id2]}
      localStorage.removeItem('bdiary.my');}catch(e){}
}
/* ── 성분 역할(이름 규칙으로 큰 갈래만) ── */
function roleOf(n){
  if(/메티콘|실록세인|실록시|실리케이트|실세스퀴옥세인|실릴레이트|다이메틸실|데케인|아이소헥사데케인/.test(n))return['질감·발림','sil'];
  if(/크로스폴리머|코폴리머|폴리머/.test(n))return['질감·발림','sil'];
  if(/산화철|티타늄디옥사이드|징크옥사이드|마이카|[가-힣]+색\d+호|울트라마린|크로뮴/.test(n))return['색·커버','col'];
  if(/^향료$|리날룰|리모넨|시트로넬|제라니올|쿠마린/.test(n))return['향','frg'];
  if(/글라이콜|헥산다이올|페녹시에탄올|파라벤|에틸헥실글리세린/.test(n))return['보존·안정','pre'];
  if(/글리세린|하이알루로|판테놀|세라마이드|베타인|스쿠알란/.test(n))return['보습','moi'];
  if(/에이트$|왁스|오일|버터|파라핀/.test(n))return['질감·발림','sil'];
  return['기타','etc'];
}
/* ── 전체 DB에서 성분이 몇 % 제품에 들어 있나 ── */
var FREQ=null,NWITH=0;
function freqInit(){if(FREQ)return;FREQ={};for(var i=0;i<P.length;i++){var g=P[i][4];if(!g.length)continue;NWITH++;var s={};for(var a=0;a<g.length;a++)if(!s[g[a]]){s[g[a]]=1;FREQ[g[a]]=(FREQ[g[a]]||0)+1}}}
/* ── 공통분모: 괜찮았던(피부가 편했던 쪽 우선) 제품 2개 이상에 겹치고, 전체의 10% 미만에만 드는 성분 ── */
function commonDen(reason){
  freqInit();
  var ids=[];for(var k in MY){if(MY[k]==='ok'&&(!reason||!WHY[k]||WHY[k]===reason||WHY[k]==='both'))ids.push(+k)}
  if(ids.length<2)return{n:ids.length,list:[]};
  var cnt={};ids.forEach(function(i){var s={};P[i][4].forEach(function(x){if(!s[x]){s[x]=1;cnt[x]=(cnt[x]||0)+1}})});
  var out=[];for(var x in cnt){if(cnt[x]>=2&&FREQ[x]/NWITH<0.10)out.push({i:+x,pct:FREQ[x]/NWITH*100,c:cnt[x]})}
  out.sort(function(a,b){return a.pct-b.pct});
  return{n:ids.length,list:out};
}
/* ── 닮은꼴: 공통분모를 가장 많이 품은 제품 (이미 기록한 건 제외) ── */
function twins(den){
  var s=sets(),tr={};s.trig.forEach(function(t){tr[t]=1});
  var want={};den.forEach(function(d){want[d.i]=1});
  var out=[];
  for(var i=0;i<P.length;i++){if(MY[i]||!P[i][4].length)continue;var h=0,bad=0;
    for(var a=0;a<P[i][4].length;a++){if(want[P[i][4][a]])h++;if(tr[P[i][4][a]])bad++}
    if(h>=Math.min(2,den.length))out.push({i:i,h:h,bad:bad})}
  out.sort(function(a,b){return b.h-a.h||a.bad-b.bad});
  return out;
}


/* ---- 차집합 엔진: 걸러낸 것에만 있고 괜찮은 것엔 없는 성분 ---- */
function sets(){
  var ok={},bad={},okN=0,badN=0;
  for(var k in MY){
    var i=+k; if(!P[i])continue;
    var ing=P[i][4],t=MY[k];
    if(t==='ok'){okN++;for(var a=0;a<ing.length;a++)ok[ing[a]]=1}
    else if(t==='no'){badN++;for(var b=0;b<ing.length;b++)bad[ing[b]]=1}
  }
  var trig=[];for(var x in bad){if(!ok[x])trig.push(+x)}
  return{ok:ok,bad:bad,trig:trig,okN:okN,badN:badN};
}

/* ---- 데이터 로드 ---- */
function loadFail(why){
  $('loadtx').innerHTML='성분 데이터를 못 불러왔습니다.<br><span style="font-size:11.5px;color:var(--muted)">'+esc(why)+'</span><br>화면을 새로고침해 주세요.';
  var b=$('loadbar').parentNode; b.className='bar';
  $('loadbar').style.background='var(--warn)';$('loadbar').style.width='100%';
}
function load(){
  var t0=Date.now();
  $('loadbar').parentNode.className='bar run';
  var tick=setInterval(function(){
    if(ready)return;
    $('loadtx').textContent=((pendingShot||pendingP)?'사진은 받았습니다. 성분 데이터를 마저 받는 중입니다':'성분 데이터를 불러오는 중입니다')+' · '+Math.round((Date.now()-t0)/1000)+'초 · 멈춘 게 아닙니다.';
  },400);

  fetch('products.json',{cache:'default'})
    .then(function(r){
      if(!r.ok) throw new Error('파일을 받지 못했습니다 (HTTP '+r.status+')');
      return r.text();
    })
    .then(function(txt){
      if(!txt||txt.length<1000) throw new Error('받은 내용이 너무 짧습니다 ('+(txt?txt.length:0)+'자)');
      var d;
      try{ d=JSON.parse(txt); }

/* 사진을 줄여서 보낸다. 못 줄이면 원본 그대로. */
function prep(f){
  return new Promise(function(res){
    var done=false;
    var fb=function(){
      if(done)return; done=true;
      var fr=new FileReader();
      fr.onload=function(){res({b64:String(fr.result).split(',')[1],mime:f.type||'image/jpeg'})};
      fr.onerror=function(){res(null)};
      fr.readAsDataURL(f);
    };
    var img=new Image();
    img.onload=function(){
      if(done)return; done=true;
      try{
        var max=900,w=img.width,h=img.height,r=Math.min(1,max/Math.max(w,h));
        var c=document.createElement('canvas');
        c.width=Math.round(w*r);c.height=Math.round(h*r);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res({b64:c.toDataURL('image/jpeg',0.8).split(',')[1],mime:'image/jpeg'});
      }catch(e){done=false;fb()}
    };
    img.onerror=fb;
    setTimeout(fb,4000);
    img.src=URL.createObjectURL(f);
  });
}

/* 읽어온 네 칸으로 DB에서 후보 찾기 — 한 토막 틀려도 점수로 흡수된다 */
function matchFields(f){
  if(!f)return[];
  var code=f['품번']?String(f['품번']).replace(/\D/g,''):'';
  matchFields.codeMiss='';
  if(code.length>=5){
    var ex=[];
    for(var i=0;i<P.length;i++)if(String(P[i][6])===code)ex.push({i:i,sc:999});
    if(ex.length)return ex;
    matchFields.codeMiss=code;   // 품번을 읽었는데 DB에 없음 → 잘못 읽었을 수 있다
  }
  var price=f['가격']?parseInt(String(f['가격']).replace(/\D/g,''),10)||0:0;
  var toks=[];
  ['제품명_한글','제품명_영문','제품명_한글추정'].forEach(function(k){
    if(f[k])String(f[k]).split(/[\s·\/&+,]+/).forEach(function(t){
      t=norm(t);if(!t)return;
      toks.push(t);
      if(EN2KO[t]&&toks.indexOf(EN2KO[t])<0)toks.push(EN2KO[t]);   // 영어 → 한글 표기로도 찾기
    });
  });
  var brands=[];
  ['브랜드_한글','브랜드_영문','브랜드_한글추정'].forEach(function(k){
    if(!f[k])return;
    var raw=String(f[k]);
    if(/[×✕]|\sx\s/i.test(raw))return;     // CICA×HYALON 같은 콜라보 문구는 브랜드가 아님
    var b=norm(raw);if(b)brands.push(b);
  });
  if(!toks.length&&!brands.length)return[];
  var qjoin=toks.join('|');
  var out=[];
  for(var j=0;j<P.length;j++){
    var hay=norm(P[j][1]+P[j][0]),hit=0,cov=0;
    for(var t=0;t<toks.length;t++)if(hay.indexOf(toks[t])>-1){hit++;cov+=toks[t].length}
    var bb=0;
    for(var b2=0;b2<brands.length;b2++){
      var bn=brands[b2];
      if(bn.length>=2&&hay.indexOf(bn.slice(0,Math.min(5,bn.length)))>-1){bb=15;break}
    }
    if(!hit&&!bb)continue;
    var sc=hit*10+bb+(toks.length?hit/toks.length*5:0);
    sc+=6*Math.min(1,cov/Math.max(hay.length,1));   // 제품명이 읽은 글자로 많이 채워질수록 (군더더기 적을수록) 가산
    if(price&&P[j][3]===price)sc+=8;                  // 가격표 금액이 같으면 가산 (다이소 구분에 강함)
    // 제형이 다르면 감점 — 같은 브랜드 같은 라인의 토너/크림/에센스를 갈라준다
    for(var ty=0;ty<TYPES.length;ty++){
      var w=TYPES[ty],inQ=qjoin.indexOf(w)>-1,inP=hay.indexOf(w)>-1;
      if(inQ&&!inP)sc-=12; else if(!inQ&&inP)sc-=4;
    }
    out.push({i:j,sc:sc});
  }
  out.sort(function(a,b){return b.sc-a.sc});
  return out.slice(0,20);
}

  var hits=[],ing=p[4];
  for(var a=0;a<ing.length;a++)if(trig[ing[a]])hits.push(V[ing[a]]);
  var inSafe=0;
  for(var b=0;b<ing.length;b++)if(s.ok[ing[b]])inSafe++;

  var vb;
  if(p[5]===2){
    vb='<div class="verdict neutral"><h3>이 제품은 성분이 아직 없습니다</h3><p>제품은 찾아지지만 비교는 못 합니다. 아직 성분을 모으지 못한 다이소 제품입니다. 뒷면 전성분을 확인해 채워 넣으면 그때부터 비교됩니다.</p></div>';
  }else if(s.okN===0&&s.badN===0){
    vb='<div class="verdict neutral"><h3>아직 비교할 기준이 없습니다</h3><p>괜찮았던 제품과 안 맞았던 제품을 각각 하나씩 기록하면, 그때부터 이 자리에서 비교해 드립니다.</p></div>';
  }else if(hits.length){
    vb='<div class="verdict no"><h3>안 맞았던 제품에만 있던 성분 '+hits.length+'개 포함</h3>'
      +'<p>아래 성분은 지금까지 걸러내신 제품에는 있고, 괜찮았던 제품에는 없던 것입니다. 맞다 아니다를 판정한 것이 아니라, 기록이 어긋나는 지점만 짚은 것입니다.</p>'
      +'<div class="chips">'+hits.map(function(x){return '<span class="chip bad">'+esc(x)+'</span>'}).join('')+'</div></div>';
  }else{
    vb='<div class="verdict ok"><h3>걸러내신 성분은 없습니다</h3><p>지금까지 안 맞았던 제품에만 있던 성분은 이 제품에 들어 있지 않습니다. 괜찮았던 제품과 겹치는 성분은 '+inSafe+'개입니다.</p></div>';
  }

  var mk=MY[i]||'';
  var chips=ing.map(function(x){
    var c=trig[x]?'chip bad':(s.ok[x]?'chip good':'chip');
    return '<span class="'+c+'">'+esc(V[x])+'</span>';
  }).join('');

  $('detail').innerHTML=vb
    +'<div class="card"><div class="sub">'+esc(p[1])+'</div><div class="ttl">'+esc(p[0])+'</div>'
    +'<div class="meta">'+esc(p[2]||'')+(p[3]?' · '+p[3].toLocaleString()+'원':'')+'</div>'
    +'<div class="acts"><button class="act y'+(mk==='ok'?' on':'')+'" data-mark="ok" data-i="'+i+'">괜찮았어요</button>'
    +'<button class="act n'+(mk==='no'?' on':'')+'" data-mark="no" data-i="'+i+'">안 맞았어요</button></div>'
    +(ing.length?'<div class="h-sm">전성분 '+ing.length+'개</div><div class="chips">'+chips+'</div>':'')
    +'<p class="src">'+srcNote(p[5])+' 제조사가 전성분을 바꾸면 실제 제품과 다를 수 있으니, 용기 뒷면 표기를 함께 확인해 주세요. 이 화면은 기록·비교용이며 의학적 판단이 아닙니다.</p></div>';
}
$('detail').addEventListener('click',function(e){
  var b=e.target.closest('[data-mark]');if(!b)return;
  var i=+b.dataset.i,m=b.dataset.mark;
  if(MY[i]===m){delete MY[i];delete WHY[i]}else{MY[i]=m;if(m!=='ok')delete WHY[i]}
  saveMy();detail(i);
  if(MY[i]==='ok')askWhy(i);
});
/* ---- 무엇이 좋았나요? ---- */
function closeSheet(){var a=document.querySelector('.sheet'),b=document.querySelector('.dim');if(a)a.remove();if(b)b.remove()}
function askWhy(i){
  closeSheet();
  var opt=[['skin','피부가 편했어요','자극·트러블 없이 편안했다'],['feel','발림·사용감이 좋았어요','질감·밀착·마무리감이 마음에 들었다'],['both','둘 다요','']];
  var h='<div class="dim"></div><div class="sheet" role="dialog" aria-label="무엇이 좋았나요"><h3>무엇이 좋았나요?</h3>'
    +'<p>나눠 두면 \'피부에 맞는 성분\'과 \'취향에 맞는 사용감\'을 따로 찾아드려요</p>';
  opt.forEach(function(o){h+='<button class="why'+(WHY[i]===o[0]?' on':'')+'" data-why="'+o[0]+'">'+o[1]+(o[2]?'<small>'+o[2]+'</small>':'')+'</button>'});
  h+='<div id="whynext"></div><button class="later" data-close="1">나중에 볼게요</button></div>';
  document.body.insertAdjacentHTML('beforeend',h);
  var sh=document.querySelector('.sheet');
  document.querySelector('.dim').addEventListener('click',closeSheet);
  sh.addEventListener('click',function(e){
    if(e.target.closest('[data-close]')){closeSheet();return}
    if(e.target.closest('.go')){var r=e.target.closest('.go').dataset.r;closeSheet();go('twins',r);return}
    var b=e.target.closest('[data-why]');if(!b)return;
    WHY[i]=b.dataset.why;saveMy();
    sh.querySelectorAll('.why').forEach(function(x){x.classList.toggle('on',x===b)});
    var okN=0;for(var k in MY)if(MY[k]==='ok')okN++;
    var d=commonDen(null),nx=$('whynext');
    if(okN<2){nx.innerHTML='<div class="done wait">✓ 기록했어요<br>괜찮았던 제품이 하나 더 쌓이면 공통분모를 찾아드려요</div>';return}
    if(!d.list.length){nx.innerHTML='<div class="done wait">✓ 기록했어요 — 괜찮았던 제품 '+okN+'개<br>아직 서로 겹치는 흔하지 않은 성분이 없어요. 기록이 쌓이면 찾아드릴게요</div>';return}
    nx.innerHTML='<div class="done">✓ 기록했어요 — 괜찮았던 제품이 '+okN+'개가 됐어요</div><button class="go" data-r="'+WHY[i]+'">이 공통분모를 가진 제품 보기 →</button>';
    sh.querySelector('.later').textContent='나중에 볼게요';
  });
}
/* ---- 닮은꼴: 공통분모를 가진 제품 + 아래 서랍 ---- */
var TWR=null;
function pageTwins(reason){
  if(reason===undefined)reason=TWR;TWR=reason;
  var pick=(reason==='skin'||reason==='feel')?reason:null,d=commonDen(pick),label='괜찮았던';
  if(pick){var cnt=0;for(var k in MY)if(MY[k]==='ok'&&(!WHY[k]||WHY[k]===pick||WHY[k]==='both'))cnt++;
    if(cnt<2||!d.list.length){pick=null;d=commonDen(null)}else label=pick==='skin'?'피부가 편했던':'사용감이 좋았던'}
  if(d.n<2||!d.list.length){
    $('page').innerHTML='<h2 class="sec-h">닮은꼴 찾기</h2><p class="empty">괜찮았던 제품을 2개 이상 기록하면<br>그 제품들의 공통분모를 가진 제품을 찾아드려요.'
      +(d.n>=2?'<br><br>지금은 괜찮았던 제품끼리 겹치는<br>흔하지 않은 성분이 아직 없어요.':'')+'</p>';return}
  var t=twins(d.list),SHOW=30,h='<h2 class="sec-h">이 공통분모를 가진 제품</h2>';
  if(!t.length){h+='<p class="empty">이 공통분모를 함께 가진 다른 제품을 아직 못 찾았어요.</p>'}
  else{h+='<div class="list">';
    t.slice(0,SHOW).forEach(function(x){var p=P[x.i];
      h+='<button class="item" data-i="'+x.i+'"><div class="flags"><span class="flag ok">공통분모 '+x.h+'/'+d.list.length+'</span>'+(x.bad?'<span class="flag no">주의 성분 '+x.bad+'개</span>':'')+'</div>'
        +'<div class="nb">'+esc(cleanName(p[0],p[1]))+(p[1]?'<span class="sl"> / </span>'+esc(p[1]):'')+'</div>'
        +'<div class="m">'+esc(p[2]||'')+(p[3]?' · '+p[3].toLocaleString()+'원':'')+' · 성분 '+p[4].length+srcTag(p[5])+'</div></button>'});
    h+='</div><p style="font-size:11.5px;color:var(--muted);margin:12px 4px">'+(t.length>SHOW?'전체 '+t.length+'개 중 상위 '+SHOW+'개 · ':'')+'이미 기록한 제품은 뺐습니다. 추천이 아니라 성분이 닮은 제품이고, 고르는 건 당신입니다.</p>'}
  var sil=0,rows='';d.list.forEach(function(x){var r=roleOf(V[x.i]);if(r[1]==='sil')sil++;
    rows+='<div class="row"><div class="nm">'+esc(V[x.i])+'<br><span class="rtag '+r[1]+'">'+r[0]+'</span></div><div class="pc">전체의 '+x.pct.toFixed(1)+'%</div></div>'});
  h+='<div style="height:96px"></div><div class="drawer"><div class="grab"></div><button class="hd" id="drhd">왜 이 제품들인가요? <span>공통분모 '+d.list.length+'개 보기 ▲</span></button>'
    +'<div class="bd den" hidden><div style="font-size:12px;color:var(--muted);margin-bottom:4px">'+label+' 제품 '+d.n+'개에 겹치고, 시중에 흔하지 않은 성분</div>'+rows
    +(sil*2>=d.list.length?'<div class="note">공통점이 대부분 <b>발림·질감을 만드는 성분</b>입니다. 피부에 잘 맞았다기보다 <b>바르는 느낌이 좋았던 것</b>일 수도 있어요. 판단은 당신의 기록으로 하세요.</div>':'<div class="note">'+label+' 제품들의 공통점입니다. 원인으로 밝혀진 것이 아니라 겹치는 지점이고, 판단은 당신의 기록으로 하세요.</div>')
    +'</div></div>';
  $('page').innerHTML=h;
  $('drhd').addEventListener('click',function(){var bd=this.nextElementSibling,op=bd.hidden;bd.hidden=!op;this.querySelector('span').textContent=op?'접기 ▼':'공통분모 '+d.list.length+'개 보기 ▲'});
}

/* ---- 목록 화면들 ---- */
function pageMine(){
  var ks=Object.keys(MY);
  if(!ks.length){
    $('page').innerHTML='<h2 class="sec-h">내 기록</h2><p class="empty">아직 기록이 없습니다.<br><br>가운데 카메라로 쓰던 제품을 찍거나 검색해서<br>“괜찮았어요 / 안 맞았어요”를 눌러 두세요.<br>두 쪽이 모이면 비교가 시작됩니다.</p>';return;
  }
  var ok='',no='';
  ks.forEach(function(k){
    var p=P[k];if(!p)return;
    var row=itemHTML(+k);
    if(MY[k]==='ok')ok+=row;else no+=row;
  });
  $('page').innerHTML='<h2 class="sec-h">내 기록</h2>'
    +'<div class="h-sm">괜찮았던 제품</div><div class="list">'+(ok||'<p class="empty">없음</p>')+'</div>'
    +'<div class="h-sm">안 맞았던 제품</div><div class="list">'+(no||'<p class="empty">없음</p>')+'</div>';
}
function pageSafe(){
  var s=sets(),k=Object.keys(s.ok);
  $('page').innerHTML='<h2 class="sec-h">나랑 맞는 성분</h2>'
    +(k.length?'<div class="card"><p style="margin:0 0 4px;font-size:13px;color:var(--ink-2)">괜찮았다고 기록하신 제품 '+s.okN+'개에 들어 있던 성분 '+k.length+'개입니다.</p><div class="chips">'
      +k.map(function(x){return '<span class="chip good">'+esc(V[x])+'</span>'}).join('')+'</div></div>'
     :'<p class="empty">괜찮았던 제품을 한 개 이상 기록하면<br>여기에 성분 울타리가 그려집니다.</p>');
}
function pageTrig(){
  var s=sets();
  $('page').innerHTML='<h2 class="sec-h">주의 성분</h2>'
    +(s.trig.length?'<div class="card"><p style="margin:0 0 4px;font-size:13px;color:var(--ink-2)">안 맞았던 제품 '+s.badN+'개에는 있고, 괜찮았던 제품 '+s.okN+'개에는 없던 성분 '+s.trig.length+'개입니다. 원인으로 밝혀진 것이 아니라 겹치지 않는 지점입니다.</p><div class="chips">'
      +s.trig.map(function(x){return '<span class="chip bad">'+esc(V[x])+'</span>'}).join('')+'</div></div>'
     :'<p class="empty">괜찮았던 제품과 안 맞았던 제품을<br>각각 하나 이상 기록하면<br>여기에 차이 나는 성분이 모입니다.</p>');
}
function pageSoon(){
  $('page').innerHTML='<h2 class="sec-h">준비 중</h2><p class="empty">닮은꼴 찾기 · 이 매장에서 고르기 · 성분 사전은<br>다음 단계에서 붙입니다.<br><br>지금은 찍기 → 검색 → 성분 → 비교까지가<br>실제로 도는지 확인하는 단계입니다.</p>';
}
/* 목록 한 줄 = "제품명 / 브랜드" 같은 글꼴로.
   제품명 앞의 [행사문구]와, 이름 앞에 또 붙은 브랜드는 떼서 알아보기 쉽게 한다 */
function cleanName(name,brand){
  var n=String(name||'').replace(/^(\s*[\[\(（【][^\]\)）】]*[\]\)）】]\s*)+/,'').trim();
  var bn=String(brand||'').replace(/\s+/g,'').toLowerCase();
  if(bn&&n.replace(/\s+/g,'').toLowerCase().indexOf(bn)===0){
    var cnt=0,k=0;
    while(k<n.length&&cnt<bn.length){if(!/\s/.test(n[k]))cnt++;k++}
    var rest=n.slice(k).trim();
    if(rest)n=rest;
  }
  return n||String(name||'');
}
function itemHTML(i,o){
  o=o||{};
  var p=P[i],mk=MY[i],fl=[];
  var brand=p[1],name=p[0];
  if(!brand){   // 브랜드 칸이 빈 제품: 이름 첫 단어를 브랜드로 보여준다 (표시만)
    var nm=cleanName(name,'').match(/^(\S{2,12})\s+(.+)$/);
    if(nm){brand=nm[1];name=nm[2]}
  }
  if(o.best)fl.push('<span class="flag best">가장 비슷함</span>');
  if(mk==='ok')fl.push('<span class="flag ok">괜찮았음</span>');
  if(mk==='no')fl.push('<span class="flag no">안 맞았음</span>');
  return '<button class="item'+(o.best?' best':'')+'" data-i="'+i+'">'
    +(fl.length?'<div class="flags">'+fl.join('')+'</div>':'')
    +'<div class="nb">'+esc(cleanName(name,brand))+(brand?'<span class="sl"> / </span>'+esc(brand):'')+'</div>'
    +'<div class="m">'+esc(p[2]||'')+(p[3]?' · '+p[3].toLocaleString()+'원':'')+(p[4].length?' · 성분 '+p[4].length:'')+srcTag(p[5])+'</div>'
    +'</button>';
}
function srcTag(s){return s===0?'<span class="tag oy">공식</span>':s===3?'<span class="tag oy">실물확인</span>':s===1?'<span class="tag ds">검증전</span>':'<span class="tag na">성분없음</span>'}
function srcNote(s){return s===0?'올리브영 상품정보고시에 공개된 전성분입니다.':s===3?'용기 뒷면 전성분을 한글·영문 표기로 맞춰 보고 확인한 성분입니다.':s===1?'다이소몰 상세이미지에서 읽어 모은 성분이라 아직 검증 전입니다. 글자를 잘못 읽은 것으로 보이는 성분은 걸러냈지만, 빠지거나 틀린 것이 남아 있을 수 있습니다.':'이 제품은 성분을 아직 모으지 못했습니다.'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
</script>

</body>
